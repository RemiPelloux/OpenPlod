name: Feature request
description: Propose an improvement to the recording or document workflow
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Platform, privacy, and device constraints
