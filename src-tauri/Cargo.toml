[package]
name = "openplod"
version = "0.3.0"
description = "Private Plaud recording vault for desktop and mobile"
authors = ["OpenPlod contributors"]
license = "MIT"
repository = "https://github.com/RemiPelloux/OpenPlod"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "openplod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
tempfile = "3"
