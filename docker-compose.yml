services:
  plaud-app:
    build: .
    ports:
      - "3456:3456"
    volumes:
      - ./data:/app/data
      - ~/Documents/PlaudSync:/plaud
    environment:
      - HOST=0.0.0.0
      - PORT=3456
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
